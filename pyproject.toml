[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-opportunity-audit"
version = "1.0.0"
description = "AI Opportunity Audit and Automation Roadmap Toolkit"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "jinja2>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
ai-audit = "ai_audit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_audit*"]

[tool.setuptools.package-data]
ai_audit = ["templates/*.j2", "templates/*"]
